apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-log-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      pod: incident-log-label
  template:
    metadata:
      labels:
        pod: incident-log-label
    spec:
      containers:
        - name: incident-log-container
          image: ergese/incident-log
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              memory: "32M"
              cpu: "0.1"
            limits:
              memory: "320M"
              cpu: "0.3"