apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: incident-log

labels:
  - pairs:
      app.kubernetes.io/part-of: incident-log

resources:
  - ../../../apps/incident-log
  - ../../../apps/incident-log-webapi

patches:
  - path: patches/incident-log-webapi.service.yaml

components:
  - ../../../components/version-developers
  - https://github.com/acidnyi/incident-log-webapi//deployments/kustomize/components/mongodb